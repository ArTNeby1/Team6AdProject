name: CI Android Mobile

on:
  push:
    branches: [ main ]
    paths:
      - "Frontend_Android/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Frontend_Android/**"
      - ".github/workflows/ci-android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  security-events: write # 上传 SARIF 到 Security 标签页要用

jobs:
  build:
    name: Build, Test & Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend_Android
    env:
      AWS_REGION: ap-southeast-1

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      # ============================================================
      # SCA：依赖漏洞扫描
      # ============================================================
      # 按周滚动的缓存 key，不跟依赖内容绑定——绑定内容的话每次改一次依赖
      # 版本缓存就失效，逼着全量重新同步 NVD 数据库（Java 那边踩过这个坑，
      # 见 ci-java.yml 的缓存 key 注释）。
      - name: 生成按周滚动的缓存 key
        id: cache-week
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      # 之前这里写的是 ~/.gradle/dependency-check-data，是瞎猜的路径，从没验证过。
      # Maven/Gradle 两个插件底层是同一个 dependency-check-core 引擎，默认数据目录
      # 是同一个 ~/.dependency-check/data（照抄 ci-java.yml 里已经验证过能用的路径）。
      # 缓存路径不对等于每次都要全量同步一遍 NVD，跟 Java 那次"SCA 跑一个多小时"
      # 是同一个坑，很可能就是这个导致同步超时/被限流、什么报告都没产出。
      - name: 缓存 NVD 数据
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: nvd-${{ runner.os }}-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: SCA 依赖漏洞扫描
        run: ./gradlew :mobile:dependencyCheckAnalyze --continue || true
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # 诊断用：不管上一步到底成没成功，先把 build/reports/ 目录实际长什么样打出来。
      # 之前 -f json + continue-on-error 会把任何失败都悄悄吞掉，下次跑完直接看
      # 这一步的日志就知道是"报告都没生成"还是"生成了只是 SARIF 格式不对"。
      - name: 列出报告目录内容（诊断用）
        if: always()
        run: find mobile/build/reports -type f 2>&1 || echo "reports 目录不存在或为空"

      - name: 上传 SCA 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sca-report
          path: Frontend_Android/mobile/build/reports/dependency-check-report.json

      # continue-on-error：dependencyCheckAnalyze 有没有真的产出这个 .sarif 文件
      # 还没在真实 CI 里验证过（这台机器没有 Gradle 环境测不了），先别让这步
      # 的失败拖垮整个 job，报告本身照样能从 android-sca-report 那个 artifact 里看。
      - name: 上传 SCA SARIF 到 Security 标签页
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Frontend_Android/mobile/build/reports/dependency-check-report.sarif
          category: dependency-check-android

      # ============================================================
      # SAST：静态代码扫描
      # ============================================================
      - name: SAST 静态代码扫描
        run: ./gradlew :mobile:lintDebug --continue || true
        continue-on-error: true

      - name: 上传 SAST 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sast-report
          path: Frontend_Android/mobile/build/reports/lint-results-debug.xml

      - name: 单元测试
        run: ./gradlew :mobile:testDebugUnitTest --continue

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: android-test-report
         path: Frontend_Android/mobile/build/reports/tests/

      # MAPS_API_KEY 走 Gradle property 注入 manifest placeholder

      - name: Build debug APK
        run: ./gradlew :mobile:assembleDebug -PMAPS_API_KEY=${{ secrets.MAPS_API_KEY }}

      - name: 配置 AWS 凭证
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 上传 APK 到 S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
            aws s3 cp mobile/build/outputs/apk/debug/ s3://ad-project-frontend-android-dev/android/${{ github.sha }}/ --recursive --exclude "*" --include "*.apk"
            aws s3 cp mobile/build/outputs/apk/debug/ s3://ad-project-frontend-android-dev/android/latest/ --recursive --exclude "*" --include "*.apk"

  # ============================================================
  # 插桩测试（androidTest）：MobileWebParityTest.kt 在 src/androidTest/ 下，
  # 需要真机/模拟器才能跑，:mobile:testDebugUnitTest 那个 JVM 单元测试任务
  # 覆盖不到它，之前一直没有对应的 CI 步骤，等于这个测试从写完就没被验证过。
  #
  # 只在 push 到 main 时跑，不在 PR 阶段跑——起模拟器要好几分钟，比其余步骤
  # 慢一个量级，PR 阶段跑会明显拖节奏；等 build job 里更快的 lint/单元测试/
  # 编译先过了再起模拟器，编译都过不了就不用浪费模拟器时间。
  # ============================================================
  instrumented-test:
    name: 插桩测试（模拟器）
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend_Android

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 开启 KVM 硬件加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 跑插桩测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          working-directory: Frontend_Android
          script: ./gradlew :mobile:connectedDebugAndroidTest -PMAPS_API_KEY=${{ secrets.MAPS_API_KEY }}

      - name: 上传插桩测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-report
          path: Frontend_Android/mobile/build/reports/androidTests/
