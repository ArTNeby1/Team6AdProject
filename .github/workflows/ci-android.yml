name: CI Android Mobile

on:
  push:
    branches: [ main ]
    paths:
      - "Frontend_Android/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Frontend_Android/**"
      - ".github/workflows/ci-android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  security-events: write # 上传 SARIF 到 Security 标签页要用

jobs:
  build:
    name: Build, Test & Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend_Android
    env:
      AWS_REGION: ap-southeast-1

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      # ============================================================
      # SCA：依赖漏洞扫描
      # ============================================================
      # 按周滚动的缓存 key，不跟依赖内容绑定——绑定内容的话每次改一次依赖
      # 版本缓存就失效，逼着全量重新同步 NVD 数据库（Java 那边踩过这个坑，
      # 见 ci-java.yml 的缓存 key 注释）。
      - name: 生成按周滚动的缓存 key
        id: cache-week
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      # 之前这里写的是 ~/.gradle/dependency-check-data，是瞎猜的路径，从没验证过。
      # Maven/Gradle 两个插件底层是同一个 dependency-check-core 引擎，默认数据目录
      # 是同一个 ~/.dependency-check/data（照抄 ci-java.yml 里已经验证过能用的路径）。
      # 缓存路径不对等于每次都要全量同步一遍 NVD，跟 Java 那次"SCA 跑一个多小时"
      # 是同一个坑，很可能就是这个导致同步超时/被限流、什么报告都没产出。
      - name: 缓存 NVD 数据
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: nvd-${{ runner.os }}-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: SCA 依赖漏洞扫描
        run: ./gradlew :mobile:dependencyCheckAnalyze --continue || true
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # 诊断用：上一轮日志证实 dependencyCheckAnalyze 任务本身是成功的（BUILD
      # SUCCESSFUL，还打印了"Generating report for project mobile"），但
      # mobile/build/reports/ 下翻遍了什么都没有——说明报告被写到了别的路径，
      # 不是任务没跑。这次不再猜单一路径，直接在 Frontend_Android 全目录下
      # 搜 dependency-check-report* 文件名，把真实落地位置钉死。
      - name: 列出报告目录内容（诊断用）
        if: always()
        run: |
          echo "=== 全局搜索 dependency-check-report* ==="
          find . -iname "dependency-check-report*" -type f 2>&1 || echo "全局搜索也没找到"
          echo "=== mobile/build/reports/ ==="
          find mobile/build/reports -type f 2>&1 || echo "mobile/build/reports 目录不存在或为空"
          echo "=== build/reports/（根项目）==="
          find build/reports -type f 2>&1 || echo "build/reports 目录不存在或为空"

      - name: 上传 SCA 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sca-report
          path: Frontend_Android/mobile/build/reports/dependency-check-report.json

      # continue-on-error：dependencyCheckAnalyze 有没有真的产出这个 .sarif 文件
      # 还没在真实 CI 里验证过（这台机器没有 Gradle 环境测不了），先别让这步
      # 的失败拖垮整个 job，报告本身照样能从 android-sca-report 那个 artifact 里看。
      - name: 上传 SCA SARIF 到 Security 标签页
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Frontend_Android/mobile/build/reports/dependency-check-report.sarif
          category: dependency-check-android

      # ============================================================
      # SAST：静态代码扫描
      # ============================================================
      - name: SAST 静态代码扫描
        run: ./gradlew :mobile:lintDebug --continue || true
        continue-on-error: true

      - name: 上传 SAST 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sast-report
          path: Frontend_Android/mobile/build/reports/lint-results-debug.xml

      - name: 单元测试
        run: ./gradlew :mobile:testDebugUnitTest --continue

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: android-test-report
         path: Frontend_Android/mobile/build/reports/tests/

      # MAPS_API_KEY 走 Gradle property 注入 manifest placeholder

      - name: Build debug APK
        run: ./gradlew :mobile:assembleDebug -PMAPS_API_KEY=${{ secrets.MAPS_API_KEY }}

      - name: 配置 AWS 凭证
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 上传 APK 到 S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
            aws s3 cp mobile/build/outputs/apk/debug/ s3://ad-project-frontend-android-dev/android/${{ github.sha }}/ --recursive --exclude "*" --include "*.apk"
            aws s3 cp mobile/build/outputs/apk/debug/ s3://ad-project-frontend-android-dev/android/latest/ --recursive --exclude "*" --include "*.apk"
