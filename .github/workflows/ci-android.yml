name: CI Android Mobile

on:
  push:
    branches: [ main ]
    paths:
      - "Frontend_Android/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Frontend_Android/**"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  security-events: write # 上传 SARIF 到 Security 标签页要用

jobs:
  build:
    name: Build, Test & Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend_Android
    env:
      AWS_REGION: ap-southeast-1

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      # ============================================================
      # SCA：依赖漏洞扫描
      # ============================================================
      # 按周滚动的缓存 key，不跟依赖内容绑定——绑定内容的话每次改一次依赖
      # 版本缓存就失效，逼着全量重新同步 NVD 数据库（Java 那边踩过这个坑，
      # 见 ci-java.yml 的缓存 key 注释）。
      - name: 生成按周滚动的缓存 key
        id: cache-week
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"


      - name: 缓存 NVD 数据
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: nvd-${{ runner.os }}-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: SCA 依赖漏洞扫描
        run: ./gradlew :mobile:dependencyCheckAnalyze --continue || true
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: 列出报告目录内容（诊断用）
        if: always()
        run: |
          echo "=== 全局搜索 dependency-check-report* ==="
          find . -iname "dependency-check-report*" -type f 2>&1 || echo "全局搜索也没找到"
          echo "=== mobile/build/reports/ ==="
          find mobile/build/reports -type f 2>&1 || echo "mobile/build/reports 目录不存在或为空"
          echo "=== build/reports/（根项目）==="
          find build/reports -type f 2>&1 || echo "build/reports 目录不存在或为空"


      - name: 上传 SCA 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sca-report
          path: Frontend_Android/mobile/build/reports/dependency-check/dependency-check-report.json

      # hashFiles 判断文件是否真的生成了：NVD 数据源偶尔会超时/限流，
      # dependencyCheckAnalyze 那步 continue-on-error 吞掉失败后，SARIF 报告
      # 可能压根没生成——这种情况下直接跳过上传，而不是硬报 "Path does not exist"
      # 让这一步显示成 failure（历史上出现过，见 2026-08-18 那次运行）。
      - name: 上传 SCA SARIF 到 Security 标签页
        if: always() && hashFiles('Frontend_Android/mobile/build/reports/dependency-check/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Frontend_Android/mobile/build/reports/dependency-check/dependency-check-report.sarif
          category: dependency-check-android

      # ============================================================
      # SAST：静态代码扫描
      # ============================================================
      # if: always() 是这次要补的关键一步：SAST（lint）跟上面的 SCA
      # 是两条独立的扫描流水线，不该因为上一条的 SARIF 上传失败就被
      # GitHub Actions 默认的 "上一步失败就跳过" 规则连带跳过。
      - name: SAST 静态代码扫描
        if: always()
        run: ./gradlew :mobile:lintDebug --continue || true
        continue-on-error: true

      - name: 上传 SAST 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sast-report
          path: Frontend_Android/mobile/build/reports/lint-results-debug.xml

      - name: 上传 SAST SARIF 到 Security 标签页
        if: always() && hashFiles('Frontend_Android/mobile/build/reports/lint-results-debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Frontend_Android/mobile/build/reports/lint-results-debug.sarif
          category: android-lint

      # 同样加 if: always()：单元测试/构建/发布不该被前面任何一步扫描报告
      # 上传失败连带卡住——扫描只报告不拦截，是这几条 pipeline 一直以来的口径。
      - name: 单元测试
        if: always()
        run: ./gradlew :mobile:testDebugUnitTest --continue

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: android-test-report
         path: Frontend_Android/mobile/build/reports/tests/

      - name: 生成覆盖率报告
        if: always()
        run: ./gradlew :mobile:jacocoTestReport

      - name: 上传 Android 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-coverage-report
          path: Frontend_Android/mobile/build/reports/jacoco/jacocoTestReport/

      # MAPS_API_KEY 走 Gradle property 注入 manifest placeholder

      - name: Build debug APK
        run: ./gradlew :mobile:assembleDebug -PMAPS_API_KEY=${{ secrets.MAPS_API_KEY }}

      - name: 配置 AWS 凭证
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 上传 APK 到 S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
            aws s3 cp mobile/build/outputs/apk/debug/ s3://ad-project-frontend-android-dev/android/${{ github.sha }}/ --recursive --exclude "*" --include "*.apk"
            aws s3 cp mobile/build/outputs/apk/debug/ s3://ad-project-frontend-android-dev/android/latest/ --recursive --exclude "*" --include "*.apk"
