name: CI Android Mobile

on:
  push:
    branches: [main, feature/mobile-app]
    paths:
      - "Frontend_Android/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "Frontend_Android/**"
      - ".github/workflows/ci-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend_Android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :mobile:assembleDebug

      - name: Run unit tests
        run: ./gradlew :mobile:testDebugUnitTest
