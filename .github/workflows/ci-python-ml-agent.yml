name: ML CI Pipeline

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ML/**'
  push:
    branches: [ main ]
    paths:
      - 'ML/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-security:
    name: Test & Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ML
      
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' 
      - name: 生成依赖缓存键
        id: dep-hash
        run: |
            # 将三个依赖文件的内容合并计算SHA256，任一文件变动即失效缓存
            HASH=$(cat requirements_ml.txt requirements.txt requirements_test.txt | sha256sum | cut -d' ' -f1)
            echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: 缓存pip依赖
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: pip-ml-${{ runner.os }}-py3.11-${{ steps.dep-hash.outputs.hash }}
          restore-keys: |
            pip-ml-${{ runner.os }}-py3.11-

      - name: 安装依赖
        run: |
          pip install --no-cache-dir \
            --index-url https://pypi.org/simple \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements_ml_ci.txt \
            -r requirements_test.txt
       
         
      - name: SCA 依赖漏洞扫描
        run: |
          python3 -m pip_audit \
             --requirement requirements_ml_ci.txt \
             --requirement requirements.txt \
             --format json \
             --output sca-report.json || true
          
          cat sca-report.json
        continue-on-error: true  

      - name: 上传 SCA 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: sca-report
         path: ML/sca-report.json

      - name: SAST
        run: |
          python3 -m pip install bandit
          bandit -r . -f json -o sast-report.json || true
          bandit -r .  # 控制台输出人类可读结果
        continue-on-error: true

      - name: 上传 SAST 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: ML/sast-report.json

      - name: 测试
        run: python3 -m pytest test_app.py --junit-xml=results.xml -v

      - name: 发布测试报告
        if: always()  # 测试失败也上传
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'ML/results.xml'

