name: ML CI Pipeline

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ML/**'
  push:
    branches: [ main ]
    paths:
      - 'ML/**'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  security-events: write # 上传 SARIF 到 Security 标签页要用

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-security:
    name: Test & Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ML
    env:
      AWS_REGION: ap-southeast-1
      ECR_REPOSITORY: adproject-ml-service

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' 
      - name: 生成依赖缓存键
        id: dep-hash
        run: |
            # 将三个依赖文件的内容合并计算SHA256，任一文件变动即失效缓存
            HASH=$(cat requirements_ml.txt requirements.txt requirements_test.txt | sha256sum | cut -d' ' -f1)
            echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: 缓存pip依赖
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: pip-ml-${{ runner.os }}-py3.11-${{ steps.dep-hash.outputs.hash }}
          restore-keys: |
            pip-ml-${{ runner.os }}-py3.11-

      - name: 安装依赖
        run: |
          pip install --no-cache-dir \
            --index-url https://pypi.org/simple \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements_ml_ci.txt \
            -r requirements_test.txt
       
         
      - name: SCA 依赖漏洞扫描
        run: |
          python3 -m pip_audit \
             --requirement requirements_ml_ci.txt \
             --requirement requirements.txt \
             --format json \
             --output sca-report.json || true
          
          cat sca-report.json
        continue-on-error: true  

      - name: 上传 SCA 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: sca-report
         path: ML/sca-report.json

      # bandit-sarif-formatter 给 bandit 注册一个 sarif 输出格式，-f 一次只能选
      # 一种格式，所以 JSON（给 artifact）和 SARIF（给 Code Scanning）分两次跑。
      - name: SAST
        run: |
          python3 -m pip install bandit bandit-sarif-formatter
          bandit -r . -f json -o sast-report.json || true
          bandit -r . -f sarif -o sast-report.sarif || true
          bandit -r .  # 控制台输出人类可读结果
        continue-on-error: true

      - name: 上传 SAST 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: ML/sast-report.json

      - name: 上传 SAST SARIF 到 Security 标签页
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ML/sast-report.sarif
          category: bandit-ml

      # 之前只跑 test_app.py（只测部署用的健康检查桩服务），app/ 目录下 5 个测试文件
      # （抽取重试健壮性、推荐防编造、行程排序、人群预测、内容推荐）从来没在 CI 里跑过。
      - name: 测试
        run: python3 -m pytest test_app.py app/ --junit-xml=results.xml --cov=app --cov-report=xml:coverage.xml --cov-report=html:coverage_html -v

      - name: 发布测试报告
        if: always()  # 测试失败也上传
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'ML/results.xml'

      - name: 上传 ML 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-coverage-report
          path: |
            ML/coverage.xml
            ML/coverage_html/

      - name: 配置 AWS 凭证
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 登录 ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com
          
      - name: 设置 Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Docker 镜像元数据
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=   
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送 Docker 镜像
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./ML
          file: ./ML/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # 镜像扫描：Trivy 扫刚推上去的镜像，只报告不拦截（跟 SCA/SAST 那几步同一个尺度）。
      # ECR 的 scan_on_push 只是被动扫描，这一步给 Code Scanning 一份带 HIGH/CRITICAL
      # 严重度过滤、真正跑在流水线里的镜像扫描结果。
      # ============================================================
      - name: Trivy 镜像扫描
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: 上传 Trivy SARIF 到 Security 标签页
        # 同 ci-java.yml：不能单纯写 always()，否则扫描步骤被跳过（非 main 分支）时
        # trivy-results.sarif 没生成，这步还是会被拉起来报 "Path does not exist"。
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-ml

      # ============================================================
      # 触发 ECS 部署：让服务拉刚推上去的 :latest 镜像
      # ============================================================
      - name: 部署到 ECS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecs update-service \
            --cluster ad-project-dev \
            --service ad-project-ml-dev \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      # ============================================================
      # 等部署真正稳定：ML 服务之前就出现过新任务健康检查一直不过、
      # 触发熔断自动回滚的情况，那次 update-service 本身没报错，CI 是
      # 绿的，只有手动查 AWS 才发现其实回滚了。加这一步让部署失败时
      # CI 直接标红，不用每次手动查。
      # ============================================================
      - name: 等待 ECS 部署稳定
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecs wait services-stable \
            --cluster ad-project-dev \
            --services ad-project-ml-dev \
            --region ${{ env.AWS_REGION }}