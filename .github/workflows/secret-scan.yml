name: Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # 上传 SARIF 到 Security 标签页要用

jobs:
  gitleaks:
    name: Gitleaks 密钥扫描
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 下载 gitleaks
        run: |
          curl -sL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      # 真扫到密钥这一步会非 0 退出（这条本来就是要拦截合并的），但报告文件在
      # 退出之前已经写好了——下面 upload-sarif 加 if: always()，扫到密钥导致
      # 这步失败也照样把证据传到 Security 标签页，不会因为流水线中断就丢了记录。
      - name: 扫描代码里的密钥
        run: ./gitleaks detect --source . --no-git --redact -v --report-format sarif --report-path gitleaks-report.sarif

      - name: 上传 SARIF 到 Security 标签页
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks
