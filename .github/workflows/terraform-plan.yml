name: Terraform IaC

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ============================================================
  # PR 阶段：Plan + 安全扫描（不实际变更）
  # ============================================================
  terraform-plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: Debug OIDC Token
        run: |
          echo "The OIDC token audience is:"
          echo $ACTIONS_ID_TOKEN_REQUEST_TOKEN | jq -R 'split(".") | .[1] | @base64d | fromjson | .aud'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAC_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -diff

      - name: Terraform Validate
        run: terraform validate

      - name: IaC 安全扫描（Checkov）
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./terraform
          framework: terraform
        continue-on-error: true

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: 生成可读 Plan 文本
        run: terraform show -no-color tfplan > plan.txt

      - name: 把 Plan 结果写到 PR 评论里
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n\n... (内容过长，已截断)';
            }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🔍 Terraform Plan 结果\n\n\`\`\`terraform\n${plan}\n\`\`\``
            });

  # ============================================================
  # Merge 到 main 后：Apply（需手动审批）
  # ============================================================
  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: DEBUG - print OIDC token claims
        run: |
          set +e
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESP" | jq -r .value)
          echo "=== TOKEN LENGTH: ${#TOKEN} ==="
          if [ "${#TOKEN}" -lt 10 ]; then
            echo "=== TOKEN NOT ISSUED! ==="
            echo "=== RAW RESPONSE: $RESP ==="
            exit 1
          fi
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          DECODED=$(echo "$PAYLOAD" | base64 -d)
          echo "=== iss: $(echo "$DECODED" | jq -r .iss) ==="
          echo "=== aud: $(echo "$DECODED" | jq -r .aud) ==="
          echo "=== sub: $(echo "$DECODED" | jq -r .sub) ==="
          echo "=== ROLE ARN set: ${{ secrets.AWS_IAC_ROLE_ARN && 'YES' || 'NO' }} ==="

      - name: Debug OIDC
        run: |
          RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "$RESP" | jq -r '.value' | cut -d. -f2 | \
            sed 's/-/+/g;s/_/\//g' | base64 -d 2>/dev/null | jq '{sub, aud, iss}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAC_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
