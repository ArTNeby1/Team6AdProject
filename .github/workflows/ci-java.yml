name: Java CI Pipeline

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: ad-project-java-service
  S3_BUCKET: ad-project-java-artifacts-dev
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  build:
    name: Build, Test & Scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write # 上传 SARIF 到 Security 标签页要用
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 生成按周滚动的缓存 key
        id: cache-week
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: 缓存 NVD 数据
        uses: actions/cache@v4
        with:
         path: ~/.dependency-check/data
         key: nvd-${{ runner.os }}-${{ steps.cache-week.outputs.week }}
         restore-keys: |
          nvd-${{ runner.os }}-

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'
          
      - name: 诊断 JDK 环境
        run: |
         echo "=== JAVA_HOME ==="
         echo $JAVA_HOME
         echo "=== java -version ==="
         java -version 2>&1
         echo "=== javac -version ==="
         javac -version 2>&1
         echo "=== mvn -version ==="
         mvn -version 2>&1
         
      # ============================================================
      # SCA：依赖漏洞扫描
      # ============================================================
      # 不再传 -Dformat=JSON——那个 CLI 属性会整个覆盖掉 pom.xml 里 <formats> 配的
      # 多格式列表（JSON+SARIF），改成只信 pom.xml 的配置，两种格式都出。
      - name: SCA 依赖漏洞扫描
        run: mvn dependency-check:check
        continue-on-error: true
        env:
         NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: 上传 SCA 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-sca-report
          path: backend/target/dependency-check-report.json

      - name: 上传 SCA SARIF 到 Security 标签页
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/target/dependency-check-report.sarif
          category: dependency-check-java

      # ============================================================
      # SAST：静态代码扫描
      # ============================================================
      # SpotBugs 分析的是编译后的字节码，不是源码——之前直接跑 spotbugs:check/spotbugs
      # 这两个独立 goal，没有触发任何编译，target/classes 是空的，实测日志是
      # "No files found to run spotbugs; check compile phase has been run."，report
      # 步骤直接被跳过，自然也不会有 spotbugsSarif.json。先跑一次 compile 补上。
      - name: SAST 静态代码扫描
        run: |
          mvn compile
          mvn spotbugs:check -Dspotbugs.failOnError=false
          mvn spotbugs:spotbugs -Dspotbugs.outputFormat=xml -Dspotbugs.sarifOutput=true
        continue-on-error: true

      - name: 上传 SAST 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-sast-report
          path: backend/target/spotbugs*.xml

      - name: 上传 SAST SARIF 到 Security 标签页
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/target/spotbugsSarif.json
          category: spotbugs

      # ============================================================
      # 单元测试
      # ============================================================
      - name: 单元测试
        run: mvn test

      - name: 上传 Java 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-coverage-report
          path: backend/target/site/jacoco/

      - name: 发布测试报告
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/*.xml'

      # ============================================================
      # 打包
      # ============================================================
      - name: 打包构建
        run: mvn package -DskipTests

      # ============================================================
      # 配置 AWS 凭证（OIDC）
      # ============================================================
      - name: 配置 AWS 凭证
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================================
      # 上传 JAR 到 S3
      # ============================================================
      - name: 上传 JAR 到 S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws s3 cp target/*.jar s3://${{ env.S3_BUCKET }}/backend/${{ github.sha }}/
          aws s3 cp target/*.jar s3://${{ env.S3_BUCKET }}/backend/latest/

      # ============================================================
      # 构建并推送 Docker 镜像到 ECR
      # ============================================================
      - name: 登录 ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: 设置 Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true
        
      - name: Docker 镜像元数据
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=   
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            

      - name: 构建并推送 Docker 镜像
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # 镜像扫描：Trivy 扫刚推上去的镜像，只报告不拦截（跟 SCA/SAST 那几步同一个尺度）。
      # ECR 的 scan_on_push 只是被动扫描，这一步给 Code Scanning 一份带 HIGH/CRITICAL
      # 严重度过滤、真正跑在流水线里的镜像扫描结果。
      # ============================================================
      - name: Trivy 镜像扫描
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: 上传 Trivy SARIF 到 Security 标签页
        # 必须跟"Trivy 镜像扫描"那步用同一个 if 条件：这里不能单纯写 always()，
        # 否则在扫描步骤被跳过（比如非 main 分支的 push）时，trivy-results.sarif
        # 根本没生成，这步还是会被拉起来，报 "Path does not exist"。
        # 加上这个条件后，只要扫描步骤本来就该跑，这里依然是"扫描失败也要上传"。
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-java

      # ============================================================
      # 触发 ECS 部署：让服务拉刚推上去的 :latest 镜像
      # ============================================================
      - name: 部署到 ECS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecs update-service \
            --cluster ad-project-dev \
            --service ad-project-java-dev \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      # ============================================================
      # 等部署真正稳定：新任务起不来触发熔断自动回滚
      # 部署失败时非 0 退出，让 CI 直接标红。
      # ============================================================
      - name: 等待 ECS 部署稳定
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TIMEOUT_SECONDS=1200
          INTERVAL_SECONDS=15
          ELAPSED=0

          while true; do
            ROLLOUT_STATE=$(aws ecs describe-services \
              --cluster ad-project-dev \
              --services ad-project-java-dev \
              --region ${{ env.AWS_REGION }} \
              --query "services[0].deployments[?status=='PRIMARY']|[0].rolloutState" \
              --output text)

            echo "rolloutState=$ROLLOUT_STATE（已等待 ${ELAPSED}s）"

            if [ "$ROLLOUT_STATE" = "COMPLETED" ]; then
              echo "部署已稳定"
              exit 0
            fi

            if [ "$ROLLOUT_STATE" = "FAILED" ]; then
              echo "部署失败：rolloutState=FAILED（大概率是熔断触发了自动回滚）"
              exit 1
            fi

            if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
              echo "等待超时（${TIMEOUT_SECONDS}s），当前 rolloutState=$ROLLOUT_STATE"
              exit 1
            fi

            sleep "$INTERVAL_SECONDS"
            ELAPSED=$((ELAPSED + INTERVAL_SECONDS))
          done
