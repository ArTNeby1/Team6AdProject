server:
  port: ${SERVER_PORT:8091}

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/LoomyTrip?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

loomytrip:
  admin-seed:
    # Local-only convenience: recreate the familiar dev admin so the console
    # still logs in after V13 removes the old committed-password seed. These
    # defaults never reach prod (prod uses application.yml's blank defaults plus
    # Secrets Manager). Override via SEED_ADMIN_* if you want different creds.
    email: ${SEED_ADMIN_EMAIL:admin@loomytrip.local}
    password: ${SEED_ADMIN_PASSWORD:Admin@12345}
  cors:
    # Vite may fall back to 5174/5175 when 5173 is taken; allow those too so a
    # port shift does not break the admin console with a CORS error.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}
