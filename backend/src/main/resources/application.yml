spring:
  application:
    name: loomytrip-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

loomytrip:
  jwt:
    secret: ${JWT_SECRET:loomytrip-dev-secret-change-me-please-32bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin-seed:
    # Initial super_admin, created on startup by AdminSeeder. Blank by default —
    # in prod ECS injects these from Secrets Manager (see terraform/rds.tf,
    # ecs.tf); blank means "do not seed". Local dev overrides in application-dev.yml.
    email: ${SEED_ADMIN_EMAIL:}
    password: ${SEED_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai:
    # ML/app 那个 FastAPI 服务的地址（uvicorn main:app --app-dir ML/app --port 8001）
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
  map:
    # Photon is the primary geocoder: public Nominatim often blocks AWS ECS IPs,
    # which made every online validate-places call mark landmarks as INVALID.
    photon-base-url: ${PHOTON_BASE_URL:https://photon.komoot.io}
    nominatim-base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    tile-url-template: ${MAP_TILE_URL_TEMPLATE:https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}
    attribution: ${MAP_ATTRIBUTION:© OpenStreetMap contributors}
    default-latitude: ${MAP_DEFAULT_LAT:1.3521}
    default-longitude: ${MAP_DEFAULT_LNG:103.8198}
    default-zoom: ${MAP_DEFAULT_ZOOM:12}
  routing:
    # Google Routes API key (F-14, 2026-08-16) — driving/walking/transit/bicycling ETAs
    # between consecutive stops. Blank (unset) degrades gracefully to a Haversine
    # straight-line estimate per mode, see RoutingClientHttp — never fails the request.
    google-maps-api-key: ${GOOGLE_MAPS_API_KEY:}

logging:
  level:
    root: INFO
    com.loomytrip.backend: DEBUG
