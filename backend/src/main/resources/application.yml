spring:
  application:
    name: loomytrip-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

loomytrip:
  jwt:
    secret: ${JWT_SECRET:loomytrip-dev-secret-change-me-please-32bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai:
    # ML/app 那个 FastAPI 服务的地址（uvicorn main:app --app-dir ML/app --port 8001）
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}

logging:
  level:
    root: INFO
    com.loomytrip.backend: DEBUG
