    <!-- integrity 是照 Chrome 实际收到的响应算的 sha384——Google Fonts 这个接口会按浏览器
         User-Agent 返回不同内容（WOFF2 支持与否等），换个 UA 拿到的字节可能不一样，
         其他浏览器如果对不上这个 hash 会导致这几款字体静默加载失败，不会报错但样式会退回
         系统默认字体。部署后建议实际用 Firefox/Safari 打开页面确认字体正常，
         DevTools 控制台没有 integrity 相关的报错。 -->
